<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | StyleSphere</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7f7f7;
            padding: 32px;
            font-family: 'Inter', sans-serif;
        }
        
        .auth-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
        }
        
        .auth-card .brand {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #ff385c;
            margin-bottom: 24px;
            cursor: pointer;
        }
        
        .auth-card .brand span {
            color: #222222;
            font-weight: 300;
        }
        
        .auth-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 24px;
            border-bottom: 2px solid #ebebeb;
        }
        
        .auth-tab {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            font-weight: 600;
            color: #6a6a6a;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
            margin-bottom: -2px;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
        }
        
        .auth-tab.active {
            color: #222222;
            border-bottom-color: #222222;
        }
        
        .auth-form {
            display: none;
        }
        
        .auth-form.active {
            display: block;
        }
        
        .auth-form .form-group {
            margin-bottom: 16px;
        }
        
        .auth-form .form-group label {
            display: block;
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 4px;
            color: #222222;
        }
        
        .auth-form .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #dddddd;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s ease;
            background: #ffffff;
            box-sizing: border-box;
        }
        
        .auth-form .form-group input:focus {
            outline: none;
            border-color: #222222;
        }
        
        .auth-form .btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }
        
        .btn-primary {
            background: #ff385c;
            color: white;
        }
        
        .btn-primary:hover {
            background: #e00b41;
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(255,56,92,0.3);
        }
        
        .btn-secondary {
            background: #f7f7f7;
            color: #222222;
            border: 1px solid #dddddd;
        }
        
        .btn-secondary:hover {
            background: #ebebeb;
        }
        
        .auth-form .forgot-link {
            text-align: right;
            margin-top: -8px;
            margin-bottom: 16px;
        }
        
        .auth-form .forgot-link a {
            color: #6a6a6a;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
        }
        
        .auth-form .forgot-link a:hover {
            color: #222222;
        }
        
        .auth-divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: #6a6a6a;
            font-size: 13px;
        }
        
        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ebebeb;
        }
        
        .auth-divider span {
            padding: 0 16px;
        }
        
        .demo-accounts {
            background: #f7f7f7;
            border-radius: 8px;
            padding: 16px;
            margin-top: 24px;
            font-size: 13px;
        }
        
        .demo-accounts p {
            margin: 4px 0;
            color: #222222;
        }
        
        .demo-accounts strong {
            color: #ff385c;
        }
        
        .guest-link {
            text-align: center;
            margin-top: 16px;
        }
        
        .guest-link a {
            color: #6a6a6a;
            font-size: 14px;
            text-decoration: none;
        }
        
        .guest-link a:hover {
            color: #222222;
        }
        
        .email-login-btn {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #dddddd;
            border-radius: 8px;
            background: #ffffff;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }
        
        .email-login-btn:hover {
            border-color: #222222;
            background: #f7f7f7;
        }
        
        .email-login-btn i {
            color: #DB4437;
            font-size: 18px;
        }
        
        /* Modal styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-overlay.open {
            display: flex;
        }
        
        .modal-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 32px;
            max-width: 440px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-card .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .modal-card .modal-header h3 {
            font-size: 20px;
            font-weight: 700;
            color: #222222;
        }
        
        .modal-card .modal-header .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #6a6a6a;
            transition: color 0.2s ease;
        }
        
        .modal-card .modal-header .close-btn:hover {
            color: #222222;
        }
        
        .modal-card .form-group {
            margin-bottom: 16px;
        }
        
        .modal-card .form-group label {
            display: block;
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 4px;
            color: #222222;
        }
        
        .modal-card .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #dddddd;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
        }
        
        .modal-card .form-group input:focus {
            outline: none;
            border-color: #222222;
        }
        
        .modal-card .btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            margin-top: 8px;
        }
        
        .modal-card .btn-secondary {
            background: #f7f7f7;
            color: #222222;
            border: 1px solid #dddddd;
        }
        
        .modal-card .btn-secondary:hover {
            background: #ebebeb;
        }
        
        .message-success { color: #10b981; font-size: 14px; margin-top: 8px; }
        .message-error { color: #ef4444; font-size: 14px; margin-top: 8px; }
        .message-info { color: #3b82f6; font-size: 14px; margin-top: 8px; }
        
        #emailStep2, #resetStep2 {
            display: none;
        }
        
        /* Toast notification override for login page */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #222222;
            color: white;
            padding: 14px 24px;
            border-radius: 50px;
            z-index: 9999;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            max-width: 400px;
        }
        
        .toast-success {
            background: #10b981;
        }
        
        .toast-error {
            background: #ef4444;
        }
    </style>
</head>
<body>

    <div class="auth-page">
        <div class="auth-card">
            <div class="brand" onclick="window.location.href='index.html'">Style<span>Sphere</span></div>
            
            <div class="auth-tabs">
                <button class="auth-tab active" id="loginTab" onclick="switchTab('login')">Login</button>
                <button class="auth-tab" id="signupTab" onclick="switchTab('signup')">Create Account</button>
            </div>

            <!-- Login Form -->
            <div id="loginForm" class="auth-form active">
                <form onsubmit="event.preventDefault(); loginUser();">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="loginEmail" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter your password" required>
                    </div>
                    <div class="forgot-link">
                        <a onclick="showResetModal()">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn btn-primary">Login →</button>
                </form>

                <div class="auth-divider"><span>OR</span></div>
                
                <button class="email-login-btn" onclick="showEmailLoginModal()">
                    <i class="fab fa-google"></i>
                    Continue with Email
                </button>

                <div class="demo-accounts">
                    <p><strong>Demo Accounts:</strong></p>
                    <!--<p>👑 Admin: admin@stylesphere.com / admin123</p>-->
                    <p>👤 Customer: user@test.com / user123</p>
                </div>
            </div>

            <!-- Signup Form -->
            <div id="signupForm" class="auth-form">
                <form onsubmit="event.preventDefault(); signupUser();">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="signupName" placeholder="Your full name" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="signupEmail" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="signupPassword" placeholder="At least 6 characters" required>
                    </div>
                    <div class="form-group">
                        <label>Phone (optional)</label>
                        <input type="tel" id="signupPhone" placeholder="+880XXXXXXXXX">
                    </div>
                    <button type="submit" class="btn btn-primary">Create Account →</button>
                </form>

                <div class="auth-divider"><span>OR</span></div>
                
                <button class="email-login-btn" onclick="showEmailLoginModal()">
                    <i class="fab fa-google"></i>
                    Continue with Email
                </button>
            </div>

            <div class="guest-link">
                <a href="shop.html">Continue as Guest →</a>
            </div>
        </div>
    </div>

    <!-- Email Login Modal -->
    <div id="emailModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fas fa-envelope"></i> Continue with Email</h3>
                <button class="close-btn" onclick="closeEmailModal()">&times;</button>
            </div>
            
            <div id="emailStep1">
                <p style="color: #6a6a6a; margin-bottom: 16px;">Enter your email address to continue.</p>
                <div class="form-group">
                    <input type="email" id="emailLoginEmail" placeholder="Your email address">
                </div>
                <div id="emailMessage"></div>
                <button class="btn btn-primary" onclick="checkEmailForLogin()">Continue</button>
            </div>
            
            <div id="emailStep2">
                <p id="newUserEmailDisplay" style="font-weight: 600;"></p>
                <p style="color: #6a6a6a; font-size: 14px; margin-bottom: 16px;">This email is new! Set a password to create your account.</p>
                <div class="form-group">
                    <label>Set Password</label>
                    <input type="password" id="newUserPassword" placeholder="Min 6 characters">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="newUserConfirmPassword" placeholder="Confirm password">
                </div>
                <div id="newUserMessage"></div>
                <button class="btn btn-primary" onclick="createNewUserWithPassword()">Create Account →</button>
                <button class="btn btn-secondary" onclick="goBackToEmailStep1()" style="margin-top: 8px;">Back</button>
            </div>
        </div>
    </div>

    <!-- Password Reset Modal -->
    <div id="resetModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fas fa-key"></i> Reset Password</h3>
                <button class="close-btn" onclick="closeResetModal()">&times;</button>
            </div>
            
            <div id="resetStep1">
                <p style="color: #6a6a6a; margin-bottom: 16px;">Enter your email to reset your password.</p>
                <div class="form-group">
                    <input type="email" id="resetEmail" placeholder="Your email address">
                </div>
                <div id="resetMessage1"></div>
                <button class="btn btn-primary" onclick="checkEmailForReset()">Continue</button>
            </div>
            
            <div id="resetStep2">
                <p id="resetEmailDisplay" style="font-weight: 600;"></p>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" placeholder="Min 6 characters">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm new password">
                </div>
                <div id="resetMessage2"></div>
                <button class="btn btn-primary" onclick="resetPassword()">Reset Password</button>
                <button class="btn btn-secondary" onclick="goBackToResetStep1()" style="margin-top: 8px;">Back</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // STANDALONE LOGIN FUNCTIONS (no external JS needed)
        // ============================================

        // --- Helper functions ---
        function showToast(message, type) {
            type = type || 'success';
            var existing = document.querySelectorAll('.toast');
            for (var i = 0; i < existing.length; i++) {
                existing[i].remove();
            }

            var toast = document.createElement('div');
            toast.className = 'toast';
            if (type === 'success') toast.classList.add('toast-success');
            if (type === 'error') toast.classList.add('toast-error');
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(function() {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(function() { toast.remove(); }, 300);
            }, 3500);
        }

        function getCurrentUser() {
            var userJson = localStorage.getItem('currentUser');
            if (!userJson) return null;
            try {
                return JSON.parse(userJson);
            } catch (e) {
                return null;
            }
        }

        // --- Tab Switching ---
        function switchTab(tab) {
            var loginTab = document.getElementById('loginTab');
            var signupTab = document.getElementById('signupTab');
            var loginForm = document.getElementById('loginForm');
            var signupForm = document.getElementById('signupForm');
            
            if (tab === 'login') {
                loginTab.classList.add('active');
                signupTab.classList.remove('active');
                loginForm.classList.add('active');
                signupForm.classList.remove('active');
            } else {
                loginTab.classList.remove('active');
                signupTab.classList.add('active');
                loginForm.classList.remove('active');
                signupForm.classList.add('active');
            }
        }

        // --- Login ---
        async function loginUser() {
            var email = document.getElementById('loginEmail').value.trim();
            var password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                showToast('Please fill all fields', 'error');
                return;
            }
            
            try {
                var response = await fetch('api/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });
                var result = await response.json();
                
                if (result.success) {
                    localStorage.setItem('currentUser', JSON.stringify(result.user));
                    showToast('Welcome back, ' + result.user.name + '!');
                    setTimeout(function() {
                        window.location.href = result.user.role === 'admin' ? 'admin-dashboard.html' : 'index.html';
                    }, 1000);
                } else {
                    showToast(result.error || 'Invalid email or password', 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showToast('Login failed. Please try again.', 'error');
            }
        }

        // --- Signup ---
        async function signupUser() {
            var name = document.getElementById('signupName').value.trim();
            var email = document.getElementById('signupEmail').value.trim();
            var password = document.getElementById('signupPassword').value;
            var phone = document.getElementById('signupPhone').value.trim();
            
            if (!name || !email || !password) {
                showToast('Please fill all required fields', 'error');
                return;
            }
            if (password.length < 6) {
                showToast('Password must be 6+ characters', 'error');
                return;
            }
            if (!email.includes('@')) {
                showToast('Enter valid email', 'error');
                return;
            }
            
            try {
                var response = await fetch('api/register.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, email: email, password: password, phone: phone })
                });
                var result = await response.json();
                
                if (result.success) {
                    showToast(result.message);
                    setTimeout(function() {
                        switchTab('login');
                        document.getElementById('loginEmail').value = email;
                    }, 1500);
                } else {
                    showToast(result.error || 'Signup failed', 'error');
                }
            } catch (error) {
                console.error('Signup error:', error);
                showToast('Signup failed. Please try again.', 'error');
            }
        }

        // --- Email Login Modal ---
        var tempEmail = '';

        function showEmailLoginModal() {
            document.getElementById('emailModal').classList.add('open');
            document.getElementById('emailStep1').style.display = 'block';
            document.getElementById('emailStep2').style.display = 'none';
            document.getElementById('emailLoginEmail').value = '';
            document.getElementById('emailMessage').innerHTML = '';
            document.getElementById('newUserMessage').innerHTML = '';
        }

        function closeEmailModal() {
            document.getElementById('emailModal').classList.remove('open');
        }

        async function checkEmailForLogin() {
            var email = document.getElementById('emailLoginEmail').value.trim();
            var msg = document.getElementById('emailMessage');
            
            if (!email || !email.includes('@')) {
                msg.innerHTML = '<span class="message-error">Please enter a valid email</span>';
                return;
            }
            
            msg.innerHTML = '<span class="message-info"><i class="fas fa-spinner fa-spin"></i> Checking...</span>';
            
            try {
                var response = await fetch('api/quick-login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, action: 'check' })
                });
                var result = await response.json();
                
                if (result.exists) {
                    // Existing user - auto login
                    var loginResponse = await fetch('api/quick-login.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: email, action: 'login' })
                    });
                    var loginResult = await loginResponse.json();
                    
                    if (loginResult.success) {
                        localStorage.setItem('currentUser', JSON.stringify(loginResult.user));
                        showToast('Welcome back ' + loginResult.user.name + '!');
                        closeEmailModal();
                        setTimeout(function() {
                            window.location.href = loginResult.user.role === 'admin' ? 'admin-dashboard.html' : 'index.html';
                        }, 1000);
                    }
                } else {
                    tempEmail = email;
                    document.getElementById('newUserEmailDisplay').innerHTML = 'Email: <strong>' + email + '</strong>';
                    document.getElementById('emailStep1').style.display = 'none';
                    document.getElementById('emailStep2').style.display = 'block';
                    document.getElementById('emailMessage').innerHTML = '';
                }
            } catch (error) {
                console.error('Error:', error);
                msg.innerHTML = '<span class="message-error">Error connecting to server</span>';
            }
        }

        async function createNewUserWithPassword() {
            var password = document.getElementById('newUserPassword').value;
            var confirm = document.getElementById('newUserConfirmPassword').value;
            var msg = document.getElementById('newUserMessage');
            
            if (!password || password.length < 6) {
                msg.innerHTML = '<span class="message-error">Password must be 6+ characters</span>';
                return;
            }
            if (password !== confirm) {
                msg.innerHTML = '<span class="message-error">Passwords do not match</span>';
                return;
            }
            
            msg.innerHTML = '<span class="message-info"><i class="fas fa-spinner fa-spin"></i> Creating account...</span>';
            
            try {
                var response = await fetch('api/quick-login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: tempEmail, password: password, action: 'create_with_password' })
                });
                var result = await response.json();
                
                if (result.success) {
                    localStorage.setItem('currentUser', JSON.stringify(result.user));
                    showToast('Welcome ' + result.user.name + '!');
                    closeEmailModal();
                    setTimeout(function() {
                        window.location.href = result.user.role === 'admin' ? 'admin-dashboard.html' : 'index.html';
                    }, 1000);
                } else {
                    msg.innerHTML = '<span class="message-error">' + (result.error || 'Failed to create account') + '</span>';
                }
            } catch (error) {
                console.error('Error:', error);
                msg.innerHTML = '<span class="message-error">Error creating account</span>';
            }
        }

        function goBackToEmailStep1() {
            document.getElementById('emailStep1').style.display = 'block';
            document.getElementById('emailStep2').style.display = 'none';
            document.getElementById('newUserMessage').innerHTML = '';
        }

        // --- Password Reset ---
        function showResetModal() {
            document.getElementById('resetModal').classList.add('open');
            document.getElementById('resetStep1').style.display = 'block';
            document.getElementById('resetStep2').style.display = 'none';
            document.getElementById('resetEmail').value = '';
            document.getElementById('resetMessage1').innerHTML = '';
            document.getElementById('resetMessage2').innerHTML = '';
        }

        function closeResetModal() {
            document.getElementById('resetModal').classList.remove('open');
        }

        async function checkEmailForReset() {
            var email = document.getElementById('resetEmail').value.trim();
            var msg = document.getElementById('resetMessage1');
            
            if (!email || !email.includes('@')) {
                msg.innerHTML = '<span class="message-error">Please enter a valid email</span>';
                return;
            }
            
            msg.innerHTML = '<span class="message-info"><i class="fas fa-spinner fa-spin"></i> Checking...</span>';
            
            try {
                var response = await fetch('api/forgot-password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, step: 'check' })
                });
                var result = await response.json();
                
                if (result.exists) {
                    document.getElementById('resetEmailDisplay').innerHTML = 'Resetting password for: <strong>' + email + '</strong>';
                    document.getElementById('resetStep1').style.display = 'none';
                    document.getElementById('resetStep2').style.display = 'block';
                    document.getElementById('resetMessage1').innerHTML = '';
                } else {
                    msg.innerHTML = '<span class="message-error">Email not found. Please check and try again.</span>';
                }
            } catch (error) {
                console.error('Error:', error);
                msg.innerHTML = '<span class="message-error">Error checking email</span>';
            }
        }

        async function resetPassword() {
            var newPass = document.getElementById('newPassword').value;
            var confirm = document.getElementById('confirmPassword').value;
            var msg = document.getElementById('resetMessage2');
            
            if (!newPass || newPass.length < 6) {
                msg.innerHTML = '<span class="message-error">Password must be 6+ characters</span>';
                return;
            }
            if (newPass !== confirm) {
                msg.innerHTML = '<span class="message-error">Passwords do not match</span>';
                return;
            }
            
            msg.innerHTML = '<span class="message-info"><i class="fas fa-spinner fa-spin"></i> Resetting...</span>';
            
            try {
                var response = await fetch('api/forgot-password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('resetEmail').value.trim(),
                        new_password: newPass,
                        step: 'reset'
                    })
                });
                var result = await response.json();
                
                if (result.success) {
                    msg.innerHTML = '<span class="message-success">✅ Password reset successfully!</span>';
                    setTimeout(function() {
                        closeResetModal();
                        showToast('Password reset successful! Please login.');
                    }, 2000);
                } else {
                    msg.innerHTML = '<span class="message-error">' + (result.error || 'Failed to reset') + '</span>';
                }
            } catch (error) {
                console.error('Error:', error);
                msg.innerHTML = '<span class="message-error">Error resetting password</span>';
            }
        }

        function goBackToResetStep1() {
            document.getElementById('resetStep1').style.display = 'block';
            document.getElementById('resetStep2').style.display = 'none';
            document.getElementById('resetMessage2').innerHTML = '';
        }

        // --- Check if already logged in ---
        if (getCurrentUser()) {
            window.location.href = 'index.html';
        }

        // --- Make functions global ---
        window.switchTab = switchTab;
        window.loginUser = loginUser;
        window.signupUser = signupUser;
        window.showEmailLoginModal = showEmailLoginModal;
        window.closeEmailModal = closeEmailModal;
        window.checkEmailForLogin = checkEmailForLogin;
        window.createNewUserWithPassword = createNewUserWithPassword;
        window.goBackToEmailStep1 = goBackToEmailStep1;
        window.showResetModal = showResetModal;
        window.closeResetModal = closeResetModal;
        window.checkEmailForReset = checkEmailForReset;
        window.resetPassword = resetPassword;
        window.goBackToResetStep1 = goBackToResetStep1;
    </script>
</body>
</html>
