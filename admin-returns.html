<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Returns - StyleSphere</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--spacing-base);
            margin-bottom: var(--spacing-lg);
        }
        
        .admin-header h1 {
            font-size: 28px;
            font-weight: var(--font-weight-bold);
        }
        
        .admin-toolbar {
            display: flex;
            gap: var(--spacing-base);
            flex-wrap: wrap;
        }
        
        .admin-toolbar input {
            padding: 0.7rem 1rem;
            border: 1px solid var(--hairline);
            border-radius: var(--radius-sm);
            font-size: 14px;
            min-width: 200px;
        }
        
        .admin-toolbar select {
            padding: 0.7rem 1rem;
            border: 1px solid var(--hairline);
            border-radius: var(--radius-sm);
            background: var(--canvas);
            font-size: 14px;
        }
        
        .returns-grid {
            display: grid;
            gap: var(--spacing-base);
        }
        
        .return-card {
            background: var(--canvas);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow);
            border-left: 4px solid var(--warning);
        }
        
        .return-card.status-approved { border-left-color: var(--success); }
        .return-card.status-rejected { border-left-color: var(--danger); }
        .return-card.status-completed { border-left-color: var(--info); }
        
        .return-card .return-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            flex-wrap: wrap;
            gap: var(--spacing-base);
        }
        
        .return-card .return-id {
            font-weight: var(--font-weight-bold);
            font-size: 16px;
        }
        
        .return-card .return-date {
            color: var(--muted);
            font-size: 13px;
        }
        
        .return-card .return-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--spacing-sm);
            margin: var(--spacing-sm) 0;
            font-size: 14px;
        }
        
        .return-card .return-details .detail-label {
            color: var(--muted);
        }
        
        .return-card .return-status {
            padding: 0.2rem 0.6rem;
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: var(--font-weight-medium);
        }
        
        .return-status.pending { background: var(--warning); color: #333; }
        .return-status.approved { background: var(--success); color: white; }
        .return-status.rejected { background: var(--danger); color: white; }
        .return-status.completed { background: var(--info); color: white; }
        
        .return-card .return-actions {
            display: flex;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-sm);
            flex-wrap: wrap;
        }
        
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-overlay.open {
            display: flex;
        }
        
        .modal-card {
            background: var(--canvas);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            max-width: 550px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-card .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
        }
        
        .modal-card .modal-header h2 {
            font-size: 20px;
            font-weight: var(--font-weight-bold);
        }
        
        .modal-card .modal-header .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--muted);
        }
        
        .modal-card .form-group {
            margin-bottom: var(--spacing-md);
        }
        
        .modal-card .form-group label {
            display: block;
            font-weight: var(--font-weight-medium);
            font-size: 14px;
            margin-bottom: var(--spacing-xs);
        }
        
        .modal-card .form-group textarea,
        .modal-card .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--hairline);
            border-radius: var(--radius-sm);
            font-family: var(--font-family);
            font-size: 14px;
        }
        
        .modal-card .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .modal-card .form-actions {
            display: flex;
            gap: var(--spacing-base);
            margin-top: var(--spacing-lg);
        }
        
        .modal-card .form-actions .btn {
            flex: 1;
        }
        
        .empty-returns {
            text-align: center;
            padding: var(--spacing-xxl);
            color: var(--muted);
        }
        
        .stats-row {
            display: flex;
            gap: var(--spacing-base);
            flex-wrap: wrap;
            margin-bottom: var(--spacing-lg);
        }
        
        .stats-row .stat-pill {
            background: var(--canvas);
            padding: 0.4rem 1rem;
            border-radius: var(--radius-full);
            box-shadow: var(--shadow);
            font-size: 14px;
        }
        
        @media (max-width: 768px) {
            .admin-toolbar {
                flex-direction: column;
                width: 100%;
            }
            
            .admin-toolbar input {
                min-width: auto;
            }
            
            .return-card .return-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- ===== TOP NAVIGATION ===== -->
    <nav class="top-nav">
        <div class="top-nav-brand">
            Style<span>Sphere</span>
        </div>
        <div class="top-nav-tabs">
            <div class="top-nav-tab" onclick="window.location.href='admin-dashboard.html'">
                <span class="tab-icon">📊</span>
                Dashboard
            </div>
            <div class="top-nav-tab" onclick="window.location.href='admin-products.html'">
                <span class="tab-icon">📦</span>
                Products
            </div>
            <div class="top-nav-tab" onclick="window.location.href='admin-orders.html'">
                <span class="tab-icon">📋</span>
                Orders
            </div>
            <div class="top-nav-tab" onclick="window.location.href='admin-users.html'">
                <span class="tab-icon">👥</span>
                Users
            </div>
        </div>
        <div class="top-nav-right">
            <button class="btn-icon" onclick="window.location.href='admin-settings.html'">
                <i class="fas fa-cog"></i>
            </button>
            <div class="user-avatar" onclick="if(confirm('Logout?')){localStorage.removeItem('currentUser');window.location.href='index.html';}">
                <i class="fas fa-user"></i>
            </div>
        </div>
    </nav>

    <!-- ===== RETURNS CONTENT ===== -->
    <div class="container">
        <div class="admin-header">
            <h1>🔄 Manage Returns & Exchanges</h1>
            <div class="admin-toolbar">
                <input type="text" id="searchReturns" placeholder="🔍 Search by Request ID or Email...">
                <select id="statusFilter">
                    <option value="all">All Status</option>
                    <option value="pending">Pending</option>
                    <option value="approved">Approved</option>
                    <option value="rejected">Rejected</option>
                    <option value="completed">Completed</option>
                </select>
                <button class="btn btn-secondary btn-sm" onclick="resetFilters()">Reset</button>
            </div>
        </div>
        
        <div class="stats-row" id="statsRow"></div>
        
        <div class="returns-grid" id="returnsGrid">
            <div class="empty-returns"><i class="fas fa-spinner fa-spin"></i> Loading returns...</div>
        </div>
    </div>

    <!-- ===== PROCESS RETURN MODAL ===== -->
    <div id="processModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h2>📋 Process Return Request</h2>
                <button class="close-btn" onclick="closeProcessModal()">&times;</button>
            </div>
            <div id="processModalContent"></div>
        </div>
    </div>

    <script src="js/navigation.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/shop.js"></script>
    <script>
        let allReturns = [];
        let allOrders = [];

        function checkAdminAccess() {
            const user = getCurrentUser();
            if (!user) { window.location.href = 'login.html'; return false; }
            if (user.role !== 'admin') { window.location.href = 'index.html'; return false; }
            return true;
        }

        async function loadReturns() {
            if (!checkAdminAccess()) return;

            try {
                const [returnsRes, ordersRes] = await Promise.all([
                    fetch('api/return-request.php?all=1'),
                    fetch('api/get-orders.php')
                ]);

                const returnsData = await returnsRes.json();
                const ordersData = await ordersRes.json();

                if (returnsData.success) allReturns = returnsData.requests;
                if (ordersData.success) allOrders = ordersData.orders;

                renderReturns();
            } catch (error) {
                console.error('Error:', error);
                showToast('Failed to load returns');
            }
        }

        function renderReturns() {
            const searchTerm = document.getElementById('searchReturns')?.value.toLowerCase() || '';
            const statusFilter = document.getElementById('statusFilter')?.value || 'all';

            let filtered = allReturns.filter(r => {
                if (searchTerm && !r.request_id.toLowerCase().includes(searchTerm) && !r.user_email.toLowerCase().includes(searchTerm)) return false;
                if (statusFilter !== 'all' && r.status !== statusFilter) return false;
                return true;
            });

            // Stats
            const stats = {
                pending: allReturns.filter(r => r.status === 'pending').length,
                approved: allReturns.filter(r => r.status === 'approved').length,
                rejected: allReturns.filter(r => r.status === 'rejected').length,
                completed: allReturns.filter(r => r.status === 'completed').length
            };

            document.getElementById('statsRow').innerHTML = `
                <span class="stat-pill">📊 Total: ${allReturns.length}</span>
                <span class="stat-pill">⏳ Pending: ${stats.pending}</span>
                <span class="stat-pill">✅ Approved: ${stats.approved}</span>
                <span class="stat-pill">❌ Rejected: ${stats.rejected}</span>
                <span class="stat-pill">🎉 Completed: ${stats.completed}</span>
            `;

            const grid = document.getElementById('returnsGrid');
            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-returns">
                        <i class="fas fa-undo-alt" style="font-size:48px; color: var(--hairline); margin-bottom: var(--spacing-md); display: block;"></i>
                        <h3>No return requests found</h3>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(r => {
                const order = allOrders.find(o => o.id == r.order_id || o.order_number == r.order_id);
                const statusClass = r.status;
                
                return `
                    <div class="return-card status-${r.status}">
                        <div class="return-header">
                            <div>
                                <span class="return-id">📋 ${escapeHtml(r.request_id)}</span>
                                <span class="return-date">${formatDate(r.created_at)}</span>
                            </div>
                            <div>
                                <span class="return-status ${r.status}">${r.status.toUpperCase()}</span>
                            </div>
                        </div>
                        <div class="return-details">
                            <div><span class="detail-label">Order:</span> ${escapeHtml(r.order_id)}</div>
                            <div><span class="detail-label">Customer:</span> ${escapeHtml(r.user_email)}</div>
                            <div><span class="detail-label">Type:</span> ${r.type === 'return' ? 'Return' : 'Exchange'}</div>
                            <div><span class="detail-label">Product ID:</span> ${r.product_id}</div>
                            <div style="grid-column: 1 / -1;"><span class="detail-label">Reason:</span> ${escapeHtml(r.reason)}</div>
                            ${r.comments ? `<div style="grid-column: 1 / -1;"><span class="detail-label">Comments:</span> ${escapeHtml(r.comments)}</div>` : ''}
                            ${r.admin_response ? `<div style="grid-column: 1 / -1;"><span class="detail-label">Admin Response:</span> ${escapeHtml(r.admin_response.substring(0, 100))}...</div>` : ''}
                        </div>
                        <div class="return-actions">
                            <button class="btn btn-primary btn-sm" onclick="processReturn('${r.request_id}')"><i class="fas fa-edit"></i> Process</button>
                            <button class="btn btn-secondary btn-sm" onclick="viewReturnDetails('${r.request_id}')"><i class="fas fa-eye"></i> View</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function processReturn(requestId) {
            const request = allReturns.find(r => r.request_id === requestId);
            if (!request) return;

            const modal = document.getElementById('processModal');
            const content = document.getElementById('processModalContent');

            content.innerHTML = `
                <form onsubmit="event.preventDefault(); submitProcessReturn('${requestId}');">
                    <div style="font-size:14px; margin-bottom: var(--spacing-md);">
                        <p><strong>Request:</strong> ${escapeHtml(request.request_id)}</p>
                        <p><strong>Order:</strong> ${escapeHtml(request.order_id)}</p>
                        <p><strong>Type:</strong> ${request.type === 'return' ? 'Return' : 'Exchange'}</p>
                        <p><strong>Customer:</strong> ${escapeHtml(request.user_email)}</p>
                        <p><strong>Reason:</strong> ${escapeHtml(request.reason)}</p>
                        ${request.comments ? `<p><strong>Comments:</strong> ${escapeHtml(request.comments)}</p>` : ''}
                    </div>
                    <div class="form-group">
                        <label>Action *</label>
                        <select id="processAction" required>
                            <option value="">Select...</option>
                            <option value="approve">✅ Approve</option>
                            <option value="reject">❌ Reject</option>
                            <option value="complete">🎉 Mark as Completed</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Response to Customer *</label>
                        <textarea id="processResponse" rows="4" placeholder="Write your response..."></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Submit</button>
                        <button type="button" class="btn btn-secondary" onclick="closeProcessModal()">Cancel</button>
                    </div>
                </form>
            `;
            modal.classList.add('open');
        }

        async function submitProcessReturn(requestId) {
            const action = document.getElementById('processAction').value;
            const response = document.getElementById('processResponse').value.trim();

            if (!action || !response) {
                showToast('Please fill all fields');
                return;
            }

            const statusMap = { approve: 'approved', reject: 'rejected', complete: 'completed' };

            try {
                const res = await fetch('api/return-request.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'update_status',
                        request_id: requestId,
                        status: statusMap[action],
                        admin_response: response
                    })
                });
                const result = await res.json();
                if (result.success) {
                    showToast(`Request ${statusMap[action]} successfully!`);
                    closeProcessModal();
                    loadReturns();
                } else {
                    showToast('Error: ' + result.error);
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('Failed to process request');
            }
        }

        function viewReturnDetails(requestId) {
            const request = allReturns.find(r => r.request_id === requestId);
            if (!request) return;

            alert(`
Request: ${request.request_id}
Order: ${request.order_id}
Customer: ${request.user_email}
Type: ${request.type}
Status: ${request.status}
Reason: ${request.reason}
Comments: ${request.comments || 'None'}
Admin Response: ${request.admin_response || 'None'}
Created: ${formatDate(request.created_at)}
            `);
        }

        function closeProcessModal() {
            document.getElementById('processModal').classList.remove('open');
        }

        function resetFilters() {
            document.getElementById('searchReturns').value = '';
            document.getElementById('statusFilter').value = 'all';
            renderReturns();
        }

        // Event listeners
        document.getElementById('searchReturns')?.addEventListener('keyup', renderReturns);
        document.getElementById('statusFilter')?.addEventListener('change', renderReturns);

        window.processReturn = processReturn;
        window.submitProcessReturn = submitProcessReturn;
        window.viewReturnDetails = viewReturnDetails;
        window.closeProcessModal = closeProcessModal;
        window.resetFilters = resetFilters;

        document.addEventListener('DOMContentLoaded', loadReturns);
    </script>
</body>
</html>
